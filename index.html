<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>SAKAWA: Astral Max</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one full-bleed 16:9 stage, letterboxed into the void; UI floats over it. */
:root{
  --void:#04050a; --ink:#0b0e18; --bone:#ece6d8; --ember:#e08a3c; --astral:#a58bff; --mist:#8fa3c4;
  --font-display:'Cinzel','Trajan Pro',Georgia,serif; --font-body:'Spectral',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--bone);font-family:var(--font-body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block}
.ui{position:absolute;inset:0;pointer-events:none}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;text-align:center;
  width:min(560px,92%);max-height:92%;overflow:auto;padding:22px 22px 18px;box-sizing:border-box;
  background:rgba(6,7,13,.86);border:1px solid rgba(236,230,216,.28);box-shadow:0 0 0 4px rgba(6,7,13,.6),0 0 0 5px rgba(236,230,216,.12)}
.panel h2{font-family:var(--font-display);font-weight:700;letter-spacing:.18em;margin:0 0 6px;font-size:clamp(18px,3.2vw,26px);text-wrap:balance}
.panel p{margin:6px 0;line-height:1.5;font-size:clamp(14px,2.2vw,17px);color:#d6cfbf}
.panel .muted{color:#9c97a8;font-style:italic}
.btn{font-family:var(--font-display);font-weight:700;letter-spacing:.16em;font-size:clamp(13px,2vw,16px);color:var(--bone);
  background:transparent;border:1px solid rgba(236,230,216,.4);padding:10px 22px;margin:6px;cursor:pointer;text-transform:uppercase;min-width:150px}
.btn:hover,.btn:focus-visible{background:rgba(236,230,216,.1);outline:none;border-color:var(--bone);box-shadow:0 0 18px rgba(165,139,255,.35)}
.btn[disabled]{opacity:.35;cursor:default}
#menu{position:absolute;left:0;right:0;bottom:9%;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;pointer-events:auto}
#menu .hint{flex-basis:100%;text-align:center;font-size:clamp(11px,1.6vw,13px);color:#9c97a8;letter-spacing:.06em;margin-top:6px;padding:0 8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.choice{font-family:var(--font-body);text-align:left;color:var(--bone);background:rgba(255,255,255,.03);border:1px solid rgba(236,230,216,.25);
  padding:10px 12px;cursor:pointer;min-width:0}
.choice b{display:block;font-family:var(--font-display);letter-spacing:.2em;font-size:15px;margin-bottom:3px}
.choice span{font-size:13.5px;color:#b8b1c4;line-height:1.35;display:block}
.choice:hover,.choice:focus-visible{outline:none;border-color:var(--astral);background:rgba(165,139,255,.1)}
.choice[disabled]{opacity:.3;cursor:default}
.c-read b{color:#9fd0ff}.c-reach b{color:#ffb38a}.c-bind b{color:#c6a8ff}.c-strike b{color:#ff8a8a}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid rgba(236,230,216,.18);padding:8px 6px}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9c97a8}
#touch{position:absolute;inset:0;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.08em;color:rgba(236,230,216,.85);
  background:rgba(10,12,22,.42);border:1.5px solid rgba(236,230,216,.32);border-radius:50%;touch-action:none}
#touch .tb.on{background:rgba(165,139,255,.35);border-color:var(--bone)}
#touch .tb.big{font-size:12px}
#pauseBtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;pointer-events:auto;width:40px;height:40px;
  background:rgba(10,12,22,.5);border:1px solid rgba(236,230,216,.35);color:var(--bone);font-family:var(--font-display);font-weight:700;cursor:pointer}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;margin:10px auto;max-width:380px;font-size:14px}
.keys dt{font-family:var(--font-display);font-weight:700;color:var(--bone);letter-spacing:.06em}
.keys dd{margin:0;color:#c9c2d4}
@media (prefers-reduced-motion:reduce){.btn,.choice{transition:none}}
</style>

</head>
<body>
<div id="game">
  <canvas id="cv" aria-label="SAKAWA: Astral Max game screen"></canvas>
  <div class="ui">
    <div id="menu" hidden>
      <button class="btn" id="bNew">Begin</button>
      <button class="btn" id="bCont" hidden>Continue</button>
      <div class="hint" id="menuHint"></div>
    </div>
    <div class="panel" id="choice" hidden></div>
    <div class="panel" id="pause" hidden>
      <h2>PAUSED</h2>
      <dl class="keys" id="keyList"></dl>
      <div>
        <button class="btn" id="bResume">Resume</button>
        <button class="btn" id="bSound">Sound: On</button>
        <button class="btn" id="bMusic">Music: On</button>
        <button class="btn" id="bTitle">Title</button>
      </div>
    </div>
    <div class="panel" id="end" hidden></div>
    <div id="touch" hidden></div>
    <button id="pauseBtn" hidden aria-label="Pause">II</button>
  </div>
</div>

<script>
(function(){
'use strict';
const W=960,H=540,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const wrap=$('game'),cv=$('cv'),ctx=cv.getContext('2d');
let S=1,DPR=1,OX=0,OY=0,Q=1,bgCache={};

/* ---------- utilities ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sign=v=>v<0?-1:v>0?1:0;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,TAU);}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);}
const _rgb={};
function rgb(hex){if(_rgb[hex])return _rgb[hex];const n=parseInt(hex.slice(1),16);return _rgb[hex]=[n>>16&255,n>>8&255,n&255];}
function hexA(hex,a){const c=rgb(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
const _sh={};
function shade(hex,amt){const k=hex+amt;if(_sh[k])return _sh[k];const c=rgb(hex);const f=amt<0?0:255,p=Math.abs(amt);
  return _sh[k]='rgb('+Math.round(c[0]+(f-c[0])*p)+','+Math.round(c[1]+(f-c[1])*p)+','+Math.round(c[2]+(f-c[2])*p)+')';}
function glow(g,x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,hexA(col,a));gr.addColorStop(1,hexA(col,0));g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
function lightCone(g,x,y,w,h,col,a){const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,hexA(col,a));gr.addColorStop(1,hexA(col,0));g.fillStyle=gr;g.beginPath();g.moveTo(x-w*.12,y);g.lineTo(x+w*.12,y);g.lineTo(x+w/2,y+h);g.lineTo(x-w/2,y+h);g.closePath();g.fill();}
function sevenRings(g,x,y,r,rot){for(let i=0;i<7;i++){const rad=r*(0.28+i*0.12);const gap=0.45+(i%3)*0.35;const a0=(i%2?rot:-rot)*(1+i*0.15)+i*1.7;g.beginPath();g.arc(x,y,rad,a0,a0+TAU-gap);g.stroke();}}
function blackSun(g,x,y,r){
  let gr=g.createRadialGradient(x,y,r*.8,x,y,r*4);gr.addColorStop(0,'rgba(255,196,140,.55)');gr.addColorStop(.25,'rgba(230,110,90,.2)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(x-r*4,y-r*4,r*8,r*8);
  g.strokeStyle='rgba(255,226,180,.85)';g.lineWidth=Math.max(1.5,r*.06);circ(g,x,y,r*1.05);g.stroke();
  g.fillStyle='#050408';circ(g,x,y,r);g.fill();
}
function stars(g,rand,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle='rgba(230,225,255,'+(a*rand())+')';const s=rand()<.08?1.8:1;g.fillRect(rand()*w,rand()*h,s,s);}}
function cityline(g,rand,w,base,col,minH,maxH,winCol,winA){
  let x=-10;while(x<w){const bw=28+rand()*70,bh=minH+rand()*(maxH-minH);g.fillStyle=col;g.fillRect(x,base-bh,bw,bh+600);
    if(rand()<.25){g.fillRect(x+bw*.45,base-bh-18,2,18);}
    if(winCol){for(let wy=base-bh+8;wy<base-6;wy+=11)for(let wx=x+5;wx<x+bw-6;wx+=9){if(rand()<.22){g.fillStyle=hexA(winCol,winA*(0.4+rand()*.6));g.fillRect(wx,wy,4,5);}}}
    x+=bw+rand()*5;}
}
function wrapText(g,text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}

/* ---------- resize ---------- */
function resize(){
  const r=wrap.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*DPR));cv.height=Math.max(1,Math.round(r.height*DPR));
  cv.style.width=r.width+'px';cv.style.height=r.height+'px';
  S=Math.min(r.width/W,r.height/H);OX=(r.width-W*S)/2;OY=(r.height-H*S)/2;
  const nq=clamp(S*DPR,0.75,1.5);if(Math.abs(nq-Q)>0.05){Q=nq;bgCache={};vignette=null;}
  layoutTouch();
}
window.addEventListener('resize',resize);

/* ---------- input ---------- */
const keys={},pressed={};
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'jump',KeyZ:'jump',KeyX:'attack',KeyJ:'attack',KeyC:'dash',KeyK:'dash',ShiftLeft:'dash',ShiftRight:'dash',
  KeyE:'project',KeyP:'project',KeyQ:'heal',KeyF:'heal',KeyR:'fp',Enter:'confirm',Escape:'pause'};
let touchMode=false;
window.addEventListener('keydown',e=>{
  const a=KM[e.code];if(!a)return;
  if(G.mode==='play'||G.mode==='dialog')e.preventDefault();
  if(!keys[a])pressed[a]=true;keys[a]=true;
  if(touchMode&&e.code!=='Escape'){touchMode=false;$('touch').hidden=true;}
  audioStart();
});
window.addEventListener('keyup',e=>{const a=KM[e.code];if(a)keys[a]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
cv.addEventListener('pointerdown',e=>{audioStart();if(G.mode==='dialog'){pressed.confirm=true;}});
const LBL={kb:{jump:'Space',attack:'X',dash:'C',heal:'Q',project:'E',fp:'R',up:'W'},touch:{jump:'JUMP',attack:'STRIKE',dash:'DASH',heal:'FOCUS',project:'PROJECT',fp:'FULL',up:'▲'}};
const K=a=>(touchMode?LBL.touch:LBL.kb)[a];

const TOUCH=[
  {k:'left',t:'◀',s:'pad',x:0,y:1},{k:'right',t:'▶',s:'pad',x:2,y:1},{k:'up',t:'▲',s:'pad',x:1,y:0},{k:'down',t:'▼',s:'pad',x:1,y:1},
  {k:'project',t:'PROJECT',s:'act',x:0,y:0},{k:'heal',t:'FOCUS',s:'act',x:1,y:0},{k:'fp',t:'FULL',s:'act',x:2,y:0},
  {k:'dash',t:'DASH',s:'act',x:0,y:1},{k:'attack',t:'STRIKE',s:'act',x:1,y:1},{k:'jump',t:'JUMP',s:'act',x:2,y:1,big:1}];
function buildTouch(){
  const box=$('touch');box.innerHTML='';
  for(const b of TOUCH){const el=document.createElement('div');el.className='tb'+(b.big?' big':'');el.textContent=b.t;el.dataset.k=b.k;b.el=el;box.appendChild(el);
    const down=e=>{e.preventDefault();audioStart();try{el.setPointerCapture(e.pointerId);}catch(_){}if(!keys[b.k])pressed[b.k]=true;keys[b.k]=true;el.classList.add('on');
      if(G.mode==='dialog'&&(b.k==='jump'||b.k==='attack'))pressed.confirm=true;};
    const up=e=>{keys[b.k]=false;el.classList.remove('on');};
    el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
}
function layoutTouch(){
  const r=wrap.getBoundingClientRect();const sz=clamp(Math.min(r.width,r.height)*0.135,42,66),gap=sz*0.16;
  const bot=Math.max(12,r.height*0.04);
  for(const b of TOUCH){if(!b.el)continue;const s=b.big?sz*1.12:sz;b.el.style.width=b.el.style.height=s+'px';
    const yy=r.height-bot-(2-b.y)*(sz+gap)+(b.big?-sz*.06:0);
    if(b.s==='pad'){b.el.style.left=(8+b.x*(sz+gap))+'px';b.el.style.top=(yy)+'px';}
    else{b.el.style.left=(r.width-8-(3-b.x)*(sz+gap))+'px';b.el.style.top=(yy)+'px';}}
}
if(window.matchMedia&&matchMedia('(pointer: coarse)').matches)touchMode=true;

/* ---------- audio ---------- */
const AU={c:null,on:true,music:true,amb:[],mode:'',nextT:0,step:0,focus:null};
function audioStart(){
  if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return;}
  try{const C=new(window.AudioContext||window.webkitAudioContext)();AU.c=C;
    const comp=C.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    AU.m=C.createGain();AU.m.gain.value=AU.on?.8:0;comp.connect(AU.m);AU.m.connect(C.destination);
    AU.sfx=C.createGain();AU.sfx.gain.value=.75;AU.sfx.connect(comp);
    AU.mus=C.createGain();AU.mus.gain.value=AU.music?.32:0;AU.mus.connect(comp);
    AU.ambB=C.createGain();AU.ambB.gain.value=.55;AU.ambB.connect(comp);
    const len=C.sampleRate*2;const b=C.createBuffer(1,len,C.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
    const ir=C.createBuffer(2,C.sampleRate*2.6,C.sampleRate);for(let ch=0;ch<2;ch++){const x=ir.getChannelData(ch);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,2.6);}
    AU.rev=C.createConvolver();AU.rev.buffer=ir;AU.revIn=C.createGain();AU.revIn.gain.value=.5;AU.revIn.connect(AU.rev);AU.rev.connect(comp);
    AU.nextT=C.currentTime+.1;if(R)setAmb(G.roomId);}catch(e){AU.c=null;}
}
function osc(f,dur,o){const C=AU.c;if(!C)return null;o=o||{};const t=C.currentTime+(o.delay||0);const v=C.createOscillator(),g=C.createGain();
  v.type=o.type||'sine';v.frequency.setValueAtTime(f,t);if(o.slide)v.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+(o.slideT||dur));if(o.detune)v.detune.value=o.detune;
  let node=v;if(o.lp){const fl=C.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;v.connect(fl);node=fl;}
  const a=o.attack||.008;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.1,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  node.connect(g);g.connect(o.bus||AU.sfx);if(o.rev)g.connect(AU.revIn);
  if(o.vib){const l=C.createOscillator(),lg=C.createGain();l.frequency.value=o.vib;lg.gain.value=f*.03;l.connect(lg);lg.connect(v.frequency);l.start(t);l.stop(t+dur+.05);}
  v.start(t);v.stop(t+dur+.05);return{v,g};}
function nz(dur,o){const C=AU.c;if(!C)return;o=o||{};const t=C.currentTime+(o.delay||0);const s=C.createBufferSource();s.buffer=AU.nb;s.playbackRate.value=o.rate||1;
  const f=C.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.setValueAtTime(o.freq||1000,t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);if(o.q)f.Q.value=o.q;
  const g=C.createGain();const a=o.attack||.004;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.2,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(o.bus||AU.sfx);if(o.rev)g.connect(AU.revIn);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function piano(n,dur,vol,delay,bus){const f=NOTE(n),b=bus||AU.mus;osc(f,dur,{type:'triangle',vol:vol,delay,bus:b,rev:1,lp:2400});osc(f*2,dur*.5,{type:'sine',vol:vol*.35,delay,bus:b,rev:1});osc(f*3.01,dur*.25,{type:'sine',vol:vol*.12,delay,bus:b});}
function bell(n,dur,vol,delay){const f=NOTE(n);osc(f,dur,{vol,delay,bus:AU.mus,rev:1});osc(f*2.76,dur*.6,{vol:vol*.4,delay,bus:AU.mus,rev:1});osc(f*5.4,dur*.3,{vol:vol*.15,delay,bus:AU.mus,rev:1});}
function swell(n,dur,vol,delay){osc(NOTE(n),dur,{type:'sawtooth',vol,delay,attack:dur*.7,bus:AU.mus,rev:1,lp:900});}
const FLOOR_SND={floorClass:'wood',floorHall:'tile',floorCaf:'lino',floorLab:'metal'};
function sfx(n,arg){if(!AU.c||!AU.on)return;switch(n){
  case 'slash':nz(.16,{type:'bandpass',freq:3200,to:900,q:1.5,vol:.28});osc(620,.12,{type:'triangle',vol:.05,slide:220});break;
  case 'hit':nz(.09,{freq:1800,vol:.4});osc(150,.16,{type:'square',vol:.12,slide:55,lp:900});osc(1200,.06,{type:'square',vol:.03,slide:600});break;
  case 'step':{const s=arg||'wood';
    if(s==='wood'){nz(.06,{freq:420,vol:.16});osc(95,.06,{vol:.06,slide:60});}
    else if(s==='tile'){nz(.04,{type:'bandpass',freq:2600,q:2,vol:.16});osc(1400,.03,{type:'triangle',vol:.012});}
    else if(s==='lino'){nz(.05,{type:'bandpass',freq:900,q:1.2,vol:.14});}
    else if(s==='metal'){nz(.05,{type:'bandpass',freq:3200,q:3,vol:.12});osc(1900+Math.random()*300,.12,{vol:.018});osc(240,.07,{vol:.04,slide:120});}
    else{bell(84+[0,3,5,7,10][Math.floor(Math.random()*5)],.5,.012,0);}break;}
  case 'land':{const k=clamp(arg||.5,.2,1.4);nz(.12,{freq:350,vol:.22*k});osc(80,.14,{vol:.14*k,slide:40});break;}
  case 'jump':nz(.08,{type:'highpass',freq:1500,vol:.07});osc(260,.12,{type:'sine',vol:.05,slide:480});break;
  case 'djump':osc(392,.35,{vol:.07,slide:784,rev:1});osc(587,.35,{vol:.04,slide:1175,rev:1});nz(.25,{type:'bandpass',freq:4000,q:2,vol:.06,rev:1});break;
  case 'dash':nz(.22,{type:'bandpass',freq:600,to:4200,q:1,vol:.24});osc(180,.15,{type:'sawtooth',vol:.03,slide:90,lp:600});break;
  case 'hurt':osc(160,.35,{type:'sawtooth',vol:.15,slide:50,lp:1200});nz(.3,{freq:900,vol:.32});osc(70,.4,{vol:.2,slide:35});break;
  case 'focus':{const r=osc(220,1,{type:'sine',vol:.06,slide:660,slideT:.9,attack:.1,rev:1});AU.focus=r;break;}
  case 'focusStop':if(AU.focus){try{AU.focus.g.gain.cancelScheduledValues(AU.c.currentTime);AU.focus.g.gain.setTargetAtTime(.0001,AU.c.currentTime,.03);}catch(e){}AU.focus=null;}break;
  case 'heal':[523,659,784,1047].forEach((f,i)=>osc(f,.7,{vol:.06,delay:i*.06,rev:1}));break;

function updateMote(e,dt){

  if(d<440){const a=Math.atan2(c.y-30-e.y,c.x-e.x);e.vx=approach(e.vx,Math.cos(a)*85,200*dt);e.vy=approach(e.vy,Math.sin(a)*85,200*dt);}
  else{e.vx=approach(e.vx,(e.hx-e.x)*.5,100*dt);e.vy=approach(e.vy,(e.hy-e.y)*.5,100*dt);}
  e.x+=e.vx*dt;e.y+=e.vy*dt+Math.sin(G.t*2+e.seed)*.4;
  e.shoot-=dt;if(e.shoot<=0&&d<520){e.shoot=2.8;const a=Math.atan2(c.y-30-e.y,c.x-e.x);G.proj.push({x:e.x,y:e.y,vx:Math.cos(a)*210,vy:Math.sin(a)*210,r:7,life:4,k:'orb',col:'#c9b8ff'});sfx('zap');}
  const box={x:e.x,y:e.y+15,w:24,h:30};if(overlap(box,P))hurtPlayer(1,e.x);if(A.active&&overlap(box,A))hurtAstral();}
function updateEcho(e,dt){
  e.flash=Math.max(0,e.flash-dt);if(e.state==='rise'){e.tm-=dt;if(e.tm<=0)e.state='follow';return;}
  e.lag=Math.max(0,(e.lag||0)-dt*.4);e.tm-=dt;
  if(e.state==='stutter'){if(e.tm<=0){e.state='follow';e.tm=4.2;for(let i=-1;i<=1;i++){const a=Math.atan2(P.y-30-(e.y-30),P.x-e.x)+i*.28;G.proj.push({x:e.x,y:e.y-30,vx:Math.cos(a)*330,vy:Math.sin(a)*330,r:6,life:3,k:'shard',col:'#9fb6ff'});}sfx('shards');}return;}
  if(e.tm<=0){e.state='stutter';e.tm=.7;sfx('rewind');return;}
  const delay=1.15-(1-e.hp/e.max)*.4+e.lag;const tt=G.t-delay;let smp=null;for(let i=G.hist.length-1;i>=0;i--){if(G.hist[i].t<=tt){smp=G.hist[i];break;}}
  if(smp){e.x=lerp(e.x,smp.x,Math.min(1,dt*14));e.y=lerp(e.y,smp.y,Math.min(1,dt*14));e.face=smp.face;e.pose=smp;}
  e.trail.push({x:e.x,y:e.y,face:e.face,pose:e.pose});if(e.trail.length>18)e.trail.shift();
  if(overlap(e,P))hurtPlayer(1,e.x);}
function updateCiencia(e,dt){
  e.flash=Math.max(0,e.flash-dt);
  if(e.state==='dormant'||e.state==='defeated')return;e.tm-=dt;const p2=e.hp<=e.max/2;
  if(p2&&!e.phase2){e.phase2=true;sfx('phase2');toast('THE CHOIR IS LEARNING YOUR INPUTS');G.flash=.5;G.flashCol='#a58bff';if(!G.flags.allSaved){spawnAdd();}}
  const hover=e.y<e.baseY-10;e.face=sign(P.x-e.x)||e.face;
  switch(e.state){
    case 'idle':if(e.tm<=0)nextAttack(e,p2);break;
    case 'tpOut':e.alpha=Math.max(0,e.alpha-dt*3.5);if(e.alpha<=0){const pts=[[150,470],[970,470],[560,340],[300,320],[820,320]];let pick;do{pick=pts[Math.floor(Math.random()*pts.length)];}while(Math.abs(pick[0]-P.x)<180);
        e.x=pick[0];e.baseY=pick[1];e.y=pick[1];e.state='tpIn';for(let i=0;i<20;i++)part(e.x,e.y-40,(Math.random()-.5)*200,(Math.random()-.5)*200,'spark','#7ff0ff');}break;
    case 'tpIn':e.alpha=Math.min(1,e.alpha+dt*3.5);if(e.alpha>=1){e.state='idle';e.tm=p2?.35:.6;}break;
    case 'grid':if(e.sub==='warn'&&e.tm<=0){e.sub='fire';e.tm=.38;for(const b of G.beams)b.on=true;sfx('beam');G.shake=Math.max(G.shake,.15);}
      else if(e.sub==='fire'&&e.tm<=0){G.beams=[];e.state='idle';e.tm=p2?.5:.8;}break;
    case 'chain':if(e.tm<=0){e.state='idle';e.tm=p2?.4:.7;}break;
    case 'mimic':if(e.tm<=0){if(e.seq>0){e.seq--;e.tm=.32;const vx=clamp((P.x-e.x)/0.95,-620,620);G.proj.push({x:e.x,y:e.y-60,vx,vy:-460,r:8,life:4,k:'beaker',grav:960,rot:0,col:'#9ff0d0'});sfx('throw');}else{e.state='idle';e.tm=.7;}}break;
    case 'predict':if(e.sub==='aim'&&e.tm<=0){e.sub='boom';e.tm=.2;const pr=G.predict;if(pr){sfx('boom');G.shake=.25;for(let i=0;i<24;i++)part(pr.x,pr.y,(Math.random()-.5)*400,(Math.random()-.5)*400,'spark','#ff7ad0');
          const c=ctrl();if(Math.hypot(c.x-pr.x,c.y-30-pr.y)<68){if(c===A)hurtAstral();else hurtPlayer(1,pr.x);}if(Math.hypot(P.x-pr.x,P.y-30-pr.y)<68&&c!==P)hurtPlayer(1,pr.x);}G.predict=null;}
      else if(e.sub==='boom'&&e.tm<=0){if(e.seq>0){e.seq--;aimPredict(e);}else{e.state='idle';e.tm=.6;G.hudPredict=null;}}break;
    case 'stagger':e.y=approach(e.y,470,500*dt);if(e.tm<=0){e.state='tpOut';e.stag=0;}break;}
  if(e.state!=='stagger'&&e.state!=='tpOut'&&e.state!=='tpIn')e.y=e.baseY+(e.baseY<460?Math.sin(G.t*2)*8:0);
  if(e.alpha>.6&&e.state!=='stagger'&&overlap(e,P))hurtPlayer(1,e.x);
  for(const b of G.beams){if(!b.on)continue;const c=ctrl();for(const tgt of A.active?[P,A]:[P]){const hit=b.k==='v'?Math.abs(tgt.x-b.x)<20:Math.abs((tgt.y-tgt.h/2)-b.y)<22;if(hit){if(tgt===A)hurtAstral();else hurtPlayer(1,b.k==='v'?b.x:tgt.x-tgt.face);}}}
}
function nextAttack(e,p2){const pool=p2?['grid','chain','predict','mimic','tp','grid','predict']:['grid','chain','mimic','tp','grid'];let a;do{a=pool[Math.floor(Math.random()*pool.length)];}while(a===e.last&&pool.length>1);e.last=a;
  if(a==='tp'){e.state='tpOut';sfx('glitch');return;}
  if(a==='grid'){e.state='grid';e.sub='warn';e.tm=p2?.62:.8;G.beams=[];const xs=[P.x];const n=p2?4:3;while(xs.length<n){const x=clamp(P.x+(Math.random()-.5)*800,50,1070);if(xs.every(v=>Math.abs(v-x)>110))xs.push(x);}
    for(const x of xs)G.beams.push({k:'v',x,on:false});if(p2)G.beams.push({k:'h',y:P.y-P.h/2,on:false});sfx('charge');return;}
  if(a==='chain'){e.state='chain';e.tm=1.3;const dir=sign(P.x-e.x)||1;const cid=Math.random();for(let i=0;i<6;i++)G.proj.push({x:e.x,y:400,vx:dir*(p2?360:300),vy:0,r:9,life:6,k:'chain',delay:i*.13,by:395,i,cid,age:0,col:'#7ff0ff'});sfx('chain');return;}
  if(a==='mimic'){e.state='mimic';e.seq=3;e.tm=.2;return;}
  if(a==='predict'){e.state='predict';e.seq=2;aimPredict(e);return;}}
function aimPredict(e){const c=P;const px=clamp(c.x+c.vx*.55,40,1080),py=clamp(c.y-30+c.vy*.18,120,450);G.predict={x:px,y:py};e.sub='aim';e.tm=.62;sfx('lock');
  const acts=['JUMP','DASH','STRIKE','RETREAT','HESITATE'];G.hudPredict='PREDICTED: '+acts[Math.floor(Math.random()*acts.length)];}
function spawnAdd(){const e=makeEnt({t:'sleeper',x:P.x<560?1000:120,id:'sx'});e.state='notice';e.tm=.8;G.ents.push(e);toast('A listener stumbles in from the stairwell');}

function hitEnt(e,dmg,dir,src){
  if(e.t==='sleeper'){if(e.state==='down')return false;e.hp-=dmg;sfx('ehit');e.flash=.12;e.state='hurt';e.tm=.28;e.vx=dir*260;e.vy=-140;
    if(e.hp<=0){e.state='down';e.vx=0;if(e.id!=='sx'){G.flags['down_'+e.id]=1;G.flags.stabilized=(G.flags.stabilized||0)+1;}sfx('stabilize');for(let i=0;i<26;i++)part(e.x,e.y-40,(Math.random()-.5)*160,-Math.random()*160,'wisp','#c9b8ff');
      G.texts.push({x:e.x,y:e.y-80,s:'stabilized',life:2,max:2,col:'#ffd2a8'});}return true;}
  if(e.t==='mote'){e.hp-=dmg;e.flash=.12;e.vx+=dir*220;if(e.hp<=0){e.dead=true;sfx('pop');G.flags['down_'+e.id]=1;for(let i=0;i<20;i++)part(e.x,e.y,(Math.random()-.5)*260,(Math.random()-.5)*260,'spark','#c9b8ff');}return true;}
  if(e.t==='echo'){if(e.state==='rise')return false;e.hp-=dmg;e.flash=.12;e.lag=(e.lag||0)+.22;if(e.hp<=0){resolveEcho(e);}return true;}
  if(e.t==='ciencia'){if(e.state==='dormant'||e.state==='defeated'||e.alpha<.5)return false;e.hp-=dmg;e.flash=.12;e.stag++;
    if(e.stag>=9&&e.state!=='stagger'&&e.hp>0){e.state='stagger';e.tm=1.7;G.beams=[];G.predict=null;G.hudPredict=null;toast('Dr. Ciencia staggers');sfx('stagger');}
    if(e.hp<=0){e.hp=0;e.state='defeated';e.y=470;e.alpha=1;G.beams=[];G.predict=null;G.hudPredict=null;G.proj=[];sfx('defeat');setTimeout(()=>resolveCiencia(e),900);}return true;}
  return false;}

/* ---------- player ---------- */
function solidList(astral){const out=[];for(const s of R.sol){if(s.k==='a'&&!astral)continue;if(s.k==='h')continue;out.push(s);}
  for(const d of R.doors||[])if(!G.flags[d.flag]&&!astral)out.push(d);
  for(const g of R.gates||[])if(g.on())out.push(g);return out;}
function moveBody(e,dt,astral){const sol=solidList(astral);
  e.x+=e.vx*dt;
  for(const s of sol){if(s.ow)continue;if(e.x+e.w/2>s.x&&e.x-e.w/2<s.x+s.w&&e.y>s.y+.01&&e.y-e.h<s.y+s.h-.01){if(e.vx>0)e.x=s.x-e.w/2;else if(e.vx<0)e.x=s.x+s.w+e.w/2;else e.x=(e.x<s.x+s.w/2)?s.x-e.w/2:s.x+s.w+e.w/2;e.vx=0;}}
  e.x=clamp(e.x,e.w/2,R.w-e.w/2);
  const pb=e.y,pt=e.y-e.h;e.y+=e.vy*dt;e.onGround=false;e.dropT=Math.max(0,(e.dropT||0)-dt);
  for(const s of sol){if(!(e.x+e.w/2>s.x&&e.x-e.w/2<s.x+s.w))continue;
    if(e.vy>=0&&pb<=s.y+.6&&e.y>=s.y){if(s.ow&&e.dropT>0)continue;e.y=s.y;e.vy=0;e.onGround=true;e.ground=s;}
    else if(!s.ow&&e.vy<0&&pt>=s.y+s.h-.6&&e.y-e.h<s.y+s.h){e.y=s.y+s.h+e.h;e.vy=0;}}}
function hazardAt(e){for(const h of R.haz||[])if(rectHit(e,h))return h;return null;}
const PRM={P:{run:300,grav:2400,maxFall:880,jump:760,dash:760},A:{run:280,grav:1300,maxFall:520,jump:620,dash:700}};
function controlEntity(e,dt,prm,isA){
  const wasG=e.onGround,vyB=e.vy;
  let dir=(keys.right?1:0)-(keys.left?1:0);
  const healing=!isA&&keys.heal&&e.onGround&&P.res>=33&&P.hp<P.maxHp&&e.atkT<=0;
  if(healing){dir=0;if(e.healT===0)sfx('focus');e.healT+=dt;if(Math.random()<dt*30)part(e.x+(Math.random()-.5)*60,e.y-10-Math.random()*50,0,0,'heal','#8affb0',e);
    if(e.healT>=.9){e.healT=0;P.hp++;P.res-=33;sfx('heal');for(let i=0;i<16;i++)part(e.x,e.y-30,(Math.random()-.5)*200,-Math.random()*200,'spark','#8affb0');}}else{if(e.healT>0)sfx('focusStop');e.healT=0;}
  if(e.dashT>0){e.dashT-=dt;e.vx=e.face*prm.dash;e.vy=0;if(Math.random()<.6)part(e.x-e.face*10,e.y-30+(Math.random()-.5)*30,-e.face*60,0,'trail',isA?'#a58bff':'#ffb06a');if(e.dashT<=0)e.vx=e.face*prm.run*.55;}
  else{if(e.recoilT>0){e.recoilT-=dt;e.vx=e.recoilV;}else e.vx=approach(e.vx,dir*prm.run,(e.onGround?4200:2800)*dt);
    if(dir&&e.atkT<=0)e.face=dir;e.vy+=prm.grav*dt;if(e.vy>prm.maxFall)e.vy=prm.maxFall;}
  if(pressed.jump)e.jumpBuf=.13;else e.jumpBuf-=dt;
  e.coyote=e.onGround?.1:e.coyote-dt;
  if(e.jumpBuf>0&&!healing){
    if(keys.down&&e.onGround&&e.ground&&e.ground.ow){e.dropT=.25;e.jumpBuf=0;e.onGround=false;e.y+=2;}
    else if(e.coyote>0){e.vy=-prm.jump;e.coyote=0;e.jumpBuf=0;e.jumpCut=false;sfx('jump');for(let i=0;i<6;i++)part(e.x,e.y,(Math.random()-.5)*120,-Math.random()*40,'dust','#c8c0b0');}
    else if(!isA&&G.ability.double&&!e.usedDouble&&e.dashT<=0){e.vy=-prm.jump*.88;e.usedDouble=true;e.jumpBuf=0;e.jumpCut=false;sfx('djump');for(let i=0;i<14;i++){const a=i/14*TAU;part(e.x+Math.cos(a)*16,e.y+Math.sin(a)*6,Math.cos(a)*120,Math.sin(a)*40,'spark','#c9b8ff');}}}
  if(!keys.jump&&e.vy<0&&!e.jumpCut){e.vy*=.45;e.jumpCut=true;}
  e.dashCD-=dt;
  if(pressed.dash&&e.dashCD<=0&&(e.onGround||e.airDash)&&!healing){e.dashT=.17;e.dashCD=.48;if(!e.onGround)e.airDash=false;sfx('dash');}
  e.atkCD-=dt;if(e.atkT>0){e.atkT-=dt;if(e.atkT>.12)attackHits(e,isA);}
  if(pressed.attack&&e.atkCD<=0&&!healing){e.atkDir=keys.up?'up':(keys.down&&!e.onGround)?'down':'side';e.atkT=.24;e.atkCD=.34;e.hitIds=new Set();sfx('slash');}
  moveBody(e,dt,isA);
  if(e.onGround&&!wasG&&vyB>320)sfx('land',vyB/900);
  if(e.onGround&&Math.abs(e.vx)>60&&e.dashT<=0){e.stepAcc=(e.stepAcc||0)+Math.abs(e.vx)*dt;if(e.stepAcc>48){e.stepAcc=0;sfx('step',isA?'astral':(e.ground&&e.ground.ow?'wood':FLOOR_SND[R.floor]));}}
  if(e.onGround){e.usedDouble=false;e.airDash=true;}
  if(Math.abs(e.vx)>20&&e.onGround)e.runPh+=dt*11.5;
}
function atkBox(e){const d=e.atkDir;if(d==='up')return{x:e.x-38,y:e.y-138,w:76,h:86};if(d==='down')return{x:e.x-34,y:e.y-14,w:68,h:80};
  return e.face>0?{x:e.x+e.w/2-4,y:e.y-62,w:82,h:60}:{x:e.x-e.w/2-78,y:e.y-62,w:82,h:60};}
function attackHits(e,isA){const b=atkBox(e);let hit=false,pogo=false;
  for(const en of G.ents){if(en.dead||e.hitIds.has(en))continue;if(isA&&!en.astral&&en.t!=='ciencia')continue;
    const box=en.t==='mote'?{x:en.x-15,y:en.y-15,w:30,h:30}:{x:en.x-en.w/2,y:en.y-en.h,w:en.w,h:en.h};
    if(b.x<box.x+box.w&&b.x+b.w>box.x&&b.y<box.y+box.h&&b.y+b.h>box.y){const dir=e.atkDir==='side'?e.face:sign(en.x-e.x)||1;
      if(hitEnt(en,1,dir,e)){e.hitIds.add(en);hit=true;if(e.atkDir==='down')pogo=true;P.res=Math.min(99,P.res+11);
        for(let i=0;i<10;i++)part((b.x+b.w/2+en.x)/2,en.y-(en.h||30)/2,(Math.random()-.5)*300,(Math.random()-.5)*300,'spark','#ffd6a0');
        for(let i=0;i<3;i++)part(en.x,en.y-20,0,0,'res','#ffb06a',P);}}}
  if(!isA&&e.atkDir==='down'&&!pogo){for(const h of R.haz||[]){if(b.x<h.x+h.w&&b.x+b.w>h.x&&b.y<h.y+h.h&&b.y+b.h>h.y-6){pogo=true;break;}}}
  if(hit){G.hitstop=.055;sfx('hit');G.shake=Math.max(G.shake,.08);}
  if(pogo&&!e.pogoDone){e.vy=-640;e.jumpCut=true;e.usedDouble=false;e.airDash=true;e.pogoDone=true;}
  else if(hit&&e.atkDir==='side'){e.recoilT=.07;e.recoilV=-e.face*230;}
  if(e.atkT<=.13)e.pogoDone=false;}
function hurtPlayer(d,fromX){if(P.inv>0||G.mode!=='play')return;P.hp-=d;P.inv=1.3;P.healT=0;P.dashT=0;const dir=sign(P.x-fromX)||-P.face;P.vx=dir*330;P.vy=-380;P.recoilT=.15;P.recoilV=dir*330;
  G.hitstop=.12;G.shake=.3;G.flash=.25;G.flashCol='#ffffff';sfx('hurt');for(let i=0;i<14;i++)part(P.x,P.y-30,(Math.random()-.5)*300,(Math.random()-.5)*300,'spark','#ffffff');
  if(A.active)endProjection(true);
  if(P.hp<=0)die();}
function hurtAstral(){if(!A.active||A.ret>0||A.inv>0)return;A.inv=1;P.hp-=1;G.shake=.25;G.flash=.3;G.flashCol='#a58bff';sfx('hurt');toast('Your astral form shatters back into your body');endProjection(true);if(P.hp<=0)die();}
function die(){G.mode='dead';G.deadT=0;sfx('death');for(let i=0;i<40;i++)part(P.x,P.y-30,(Math.random()-.5)*400,(Math.random()-.5)*400,'wisp','#c9b8ff');}
function respawn(){const s=G.save;P.hp=P.maxHp;P.res=0;P.inv=1;G.fight=null;G.hist=[];G.beams=[];G.predict=null;G.hudPredict=null;
  if(s)loadRoom(s.room,s.x,s.y);else loadRoom('classroom',140,470);G.mode='play';}
function startProjection(force){if(!G.ability.project||A.active||(!P.onGround&&!force)||P.healT>0)return;
  Object.assign(A,body(22,54),{active:true,timer:60,ret:0,x:P.x,y:P.y-6,vy:-180,face:P.face,inv:.4});
  sfx('project');ambAstral(true);for(let i=0;i<24;i++)part(P.x,P.y-30,(Math.random()-.5)*200,-Math.random()*200,'wisp','#a58bff');P.vx=0;}
function endProjection(forced){if(!A.active||A.ret>0)return;A.ret=.4;A.rx=A.x;A.ry=A.y;sfx('return');ambAstral(false);if(forced){G.shake=Math.max(G.shake,.2);}}

/* ---------- particles / text ---------- */
function part(x,y,vx,vy,k,col,follow){if(G.parts.length>500)return;G.parts.push({x,y,vx,vy,k,col,life:k==='res'?.6:k==='z'?2:k==='wisp'?1.4:k==='heal'?.7:k==='trail'?.3:.5,max:k==='res'?.6:k==='z'?2:k==='wisp'?1.4:k==='heal'?.7:k==='trail'?.3:.5,f:follow,sx:x,sy:y});}
function updateParts(dt){for(const p of G.parts){p.life-=dt;
  if(p.k==='res'){const t=1-p.life/p.max;p.x=lerp(p.sx,p.f.x,t*t);p.y=lerp(p.sy-40*Math.sin(t*3),p.f.y-30,t*t);continue;}
  if(p.k==='heal'&&p.f){p.x=lerp(p.x,p.f.x,dt*6);p.y=lerp(p.y,p.f.y-30,dt*6);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='dust'||p.k==='spark'){p.vx*=.92;p.vy*=.92;if(p.k==='dust')p.vy+=200*dt;}
  if(p.k==='wisp'){p.vy-=40*dt;p.vx*=.97;}if(p.k==='z'){p.x+=Math.sin(p.life*4)*.4;}}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.life-=dt;t.y-=dt*10;}G.texts=G.texts.filter(t=>t.life>0);
  for(const t of G.toasts)t.life-=dt;G.toasts=G.toasts.filter(t=>t.life>0);}
function drawParts(g){g.save();g.globalCompositeOperation='lighter';for(const p of G.parts){const a=clamp(p.life/p.max,0,1);
  if(p.k==='z'){g.globalCompositeOperation='source-over';g.fillStyle='rgba(220,210,255,'+a*.8+')';g.font='italic 12px Spectral, Georgia, serif';g.fillText('z',p.x,p.y);g.globalCompositeOperation='lighter';continue;}

function render(){
  const g=ctx;g.setTransform(1,0,0,1,0,0);g.fillStyle='#04050a';g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(DPR*S,0,0,DPR*S,DPR*OX,DPR*OY);g.save();g.beginPath();g.rect(0,0,W,H);g.clip();

  if(!R){g.restore();return;}

  drawDecor(g);
  for(const s of R.sigils||[])drawSigil(g,s);for(const a of R.anchors||[])drawAnchor(g,a);for(const gt of R.gates||[])drawGate(g,gt);
  for(const e of G.ents){if(e.t==='sleeper')drawSleeper(g,e);}

  drawPlayer(g);

  g.restore();
  // astral overlay
  if(G.astralMix>0){const a=G.astralMix;g.save();g.globalCompositeOperation='color';g.fillStyle='rgba(110,80,220,'+.62*a+')';g.fillRect(0,0,W,H);g.restore();
    g.save();g.globalAlpha=.18*a;g.globalCompositeOperation='screen';const L=getLayer(R.layers.length-1);const f=R.layers[R.layers.length-1].f;g.translate(W/2,H/2);g.rotate(.04+Math.sin(G.t*.3)*.01);g.translate(-W/2+18,-H/2-10);g.drawImage(L.c,-cx*f,-cy*f,L.lw,L.lh);g.restore();

  g.save();g.translate(-cx,-cy);

  if(G.mode==='dead'){const a=Math.min(1,G.deadT/1.2);g.fillStyle='rgba(2,2,6,'+a*.9+')';g.fillRect(0,0,W,H);g.fillStyle='rgba(236,230,216,'+a+')';g.font='700 30px Cinzel, Georgia, serif';g.textAlign='center';g.fillText('Your mind came loose.',W/2,H/2);

function drawFG(g,cx,cy){const id=G.roomId;const f=1.3;g.save();g.translate(cx,cy);g.translate(-cx*f,-cy*f);g.fillStyle='rgba(3,4,8,.93)';
  const chair=(x,y)=>{rr(g,x,y,74,9,3);g.fill();rr(g,x+60,y-62,11,66,4);g.fill();g.fillRect(x+6,y+8,6,60);g.fillRect(x+60,y+8,6,60);};

    g.fillStyle='rgba(3,4,8,.93)';for(let x=150;x<R.w*f;x+=760){rr(g,x,R.h*f-150,56,90,6);g.fill();rr(g,x-4,R.h*f-156,64,10,3);g.fill();chair(x+260,R.h*f-118);}}
  if(id==='lab'){g.strokeStyle='rgba(3,4,8,.9)';g.lineWidth=8;for(let x=0;x<R.w*f;x+=360){g.beginPath();g.moveTo(x,0);g.quadraticCurveTo(x+60,90,x+140,10);g.stroke();}rr(g,420,500,90,90,6);g.fill();rr(g,1180,470,140,110,6);g.fill();}

function drawHUD(g){if(G.mode==='end')return;
  const res=P.res/99,full=P.res>=99;const vx=56,vy=56,vr=34;
  g.save();g.fillStyle='rgba(4,5,10,.65)';circ(g,vx,vy,vr+6);g.fill();g.save();circ(g,vx,vy,vr);g.clip();const ly=vy+vr-res*vr*2;
  const gr=g.createLinearGradient(0,vy-vr,0,vy+vr);gr.addColorStop(0,full?'#d6c4ff':'#ffd08a');gr.addColorStop(1,full?'#6a48d8':'#c0561c');g.fillStyle=gr;g.beginPath();g.moveTo(vx-vr,vy+vr);
  for(let x=-vr;x<=vr;x+=4)g.lineTo(vx+x,ly+Math.sin(G.t*3+x*.15)*2.5);g.lineTo(vx+vr,vy+vr);g.fill();g.restore();
  g.strokeStyle='rgba(236,230,216,.85)';g.lineWidth=2;circ(g,vx,vy,vr);g.stroke();g.strokeStyle='rgba(236,230,216,.3)';g.lineWidth=1;circ(g,vx,vy,vr+5);g.stroke();
  if(full){g.globalCompositeOperation='lighter';glow(g,vx,vy,70,'#a58bff',.3+.15*Math.sin(G.t*5));g.globalCompositeOperation='source-over';}
  for(let i=0;i<G.overdraw&&i<5;i++){g.strokeStyle='rgba(200,170,255,.9)';g.lineWidth=1.2;const a=-1.2+i*.6;g.beginPath();g.moveTo(vx+Math.cos(a)*vr,vy+Math.sin(a)*vr);g.lineTo(vx+Math.cos(a)*(vr-12),vy+Math.sin(a+.15)*(vr-12));g.stroke();}

    if(on){const hg=g.createLinearGradient(0,-13,0,13);hg.addColorStop(0,'#fff8ec');hg.addColorStop(1,'#cfc4b0');g.fillStyle=hg;g.fill();g.fillStyle='#1a1420';circ(g,0,-1,2.4);g.fill();}
    else{g.fillStyle='rgba(20,20,30,.6)';g.fill();g.strokeStyle='rgba(236,230,216,.35)';g.lineWidth=1.2;g.stroke();}g.restore();}
  g.font='600 12px Spectral, Georgia, serif';g.fillStyle='rgba(236,230,216,.7)';g.fillText(full?'FULL POTENTIAL READY ['+K('fp')+']':'RESONANCE',96,76);
  if(A.active){const t=Math.max(0,A.timer),k=t/60;g.strokeStyle='rgba(165,139,255,.25)';g.lineWidth=5;circ(g,W/2,46,26);g.stroke();g.strokeStyle=t<10?'#ff8ab0':'#c9b8ff';g.beginPath();g.arc(W/2,46,26,-Math.PI/2,-Math.PI/2+TAU*k);g.stroke();
    g.fillStyle='#ece6ff';g.font='700 15px Cinzel, Georgia, serif';g.textAlign='center';g.fillText(Math.ceil(t),W/2,51);g.font='600 11px Spectral, Georgia, serif';g.fillText('ASTRAL · ['+K('project')+'] to return',W/2,88);g.textAlign='left';}
  if(G.fight&&G.fight.e&&G.mode!=='choice'){const e=G.fight.e;g.textAlign='center';g.font='700 15px Cinzel, Georgia, serif';g.fillStyle='rgba(236,230,216,.9)';g.fillText(G.fight.name,W/2,H-34);
    g.font='italic 12px Spectral, Georgia, serif';g.fillStyle='rgba(200,190,220,.8)';g.fillText(G.fight.sub,W/2,H-16);g.textAlign='left';
    g.fillStyle='rgba(236,230,216,.15)';g.fillRect(W/2-160,H-56,320,3);g.fillStyle='rgba(236,230,216,.8)';g.fillRect(W/2-160,H-56,320*Math.max(0,e.hp/e.max),3);}
  if(G.hudPredict&&G.fight){g.textAlign='center';g.font='700 14px Cinzel, Georgia, serif';g.fillStyle='rgba(255,154,216,'+(.6+.4*Math.sin(G.t*20))+')';g.fillText(G.hudPredict,W/2,120);g.textAlign='left';}
  let ty=150;for(const t of G.toasts){const a=Math.min(1,t.life,(t.max-t.life)*4);g.textAlign='center';g.font='italic 17px Spectral, Georgia, serif';const tw=g.measureText(t.s).width+44;const bg=g.createLinearGradient(W/2-tw/2,0,W/2+tw/2,0);bg.addColorStop(0,'rgba(4,5,10,0)');bg.addColorStop(.15,'rgba(4,5,10,'+.8*a+')');bg.addColorStop(.85,'rgba(4,5,10,'+.8*a+')');bg.addColorStop(1,'rgba(4,5,10,0)');g.fillStyle=bg;g.fillRect(W/2-tw/2,ty-20,tw,28);g.fillStyle='rgba(236,230,216,'+a+')';g.fillText(t.s,W/2,ty);g.textAlign='left';ty+=32;}
  if(G.card){const t=G.card.t,a=t<1?t:t>3?Math.max(0,4-t):1;const cb=g.createLinearGradient(0,H*.32-70,0,H*.32+80);cb.addColorStop(0,'rgba(3,4,8,0)');cb.addColorStop(.5,'rgba(3,4,8,'+.7*a+')');cb.addColorStop(1,'rgba(3,4,8,0)');g.fillStyle=cb;g.fillRect(0,H*.32-70,W,150);g.textAlign='center';g.fillStyle='rgba(236,230,216,'+a+')';g.font='700 40px Cinzel, Georgia, serif';g.fillText(G.card.name.toUpperCase(),W/2,H*.32);

    g.beginPath();g.moveTo(W/2,H*.32+10);g.lineTo(W/2+6,H*.32+16);g.lineTo(W/2,H*.32+22);g.lineTo(W/2-6,H*.32+16);g.closePath();g.stroke();
    g.font='italic 17px Spectral, Georgia, serif';g.fillText(G.card.sub,W/2,H*.32+46);g.textAlign='left';}
  g.restore();}

/* ---------- menus ---------- */
function setMenuHint(){$('menuHint').textContent=touchMode?'Touch controls appear in play. Tap PROJECT to leave your body.':'A/D move · Space jump · X strike · C dash · Q focus (hold) · E project · R full potential · W talk / rest · Esc pause';}
function showTitle(){G.mode='title';$('menu').hidden=false;$('touch').hidden=true;$('pauseBtn').hidden=true;$('pause').hidden=true;$('choice').hidden=true;$('end').hidden=true;
  const s=readSave();$('bCont').hidden=!s;setMenuHint();setTimeout(()=>(s?$('bCont'):$('bNew')).focus(),30);}
function enterPlay(){$('menu').hidden=true;$('touch').hidden=!touchMode;$('pauseBtn').hidden=false;G.mode='play';for(const k in keys)keys[k]=false;layoutTouch();}
function newGame(){clearSave();Object.assign(G,{flags:{},ability:{project:false,double:false},tend:{connection:0,control:0,rupture:0},witness:0,overdraw:0,anchors:{},visited:{},save:null,fight:null,hist:[],astralMix:0,card:null,trans:null});
  Object.assign(P,body(24,58),{hp:5,maxHp:5,res:0});enterPlay();loadRoom('classroom',140,470);G.save={room:'classroom',x:140,y:470};}

  Object.assign(P,body(24,58),{hp:5,maxHp:5,res:0});enterPlay();loadRoom(s.room,s.x,s.y);}
function openPause(){G.mode='pause';sfx('pause');$('pause').hidden=false;const kl=$('keyList');kl.innerHTML='';
  const rows=touchMode?[['◀ ▶','Move'],['JUMP','Jump · tap again midair to levitate'],['STRIKE','Psychic strike · hold ▲/▼ to aim'],['DASH','Dash'],['FOCUS','Hold to heal with Resonance'],['PROJECT','Leave / return to your body'],['FULL','Full Potential (permanent cost)'],['▲','Talk · Rest at benches']]
    :[['A / D','Move'],['Space','Jump · again midair to levitate'],['X','Psychic strike · hold W/S to aim'],['C','Dash'],['Q (hold)','Focus Resonance to heal'],['E','Leave / return to your body'],['R','Full Potential (permanent cost)'],['W','Talk · Rest at benches'],['S + Space','Drop through desks and tables']];
  for(const r of rows){const dt=document.createElement('dt');dt.textContent=r[0];const dd=document.createElement('dd');dd.textContent=r[1];kl.append(dt,dd);}
  $('bSound').textContent='Sound: '+(AU.on?'On':'Off');$('bMusic').textContent='Music: '+(AU.music?'On':'Off');setTimeout(()=>$('bResume').focus(),30);}

$('bSound').onclick=()=>{AU.on=!AU.on;if(AU.m)AU.m.gain.value=AU.on?.8:0;$('bSound').textContent='Sound: '+(AU.on?'On':'Off');};

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;
  try{if(G.mode==='title'||G.mode==='boot')G.t+=dt;else update(dt);audioTick();render();}catch(err){console.error(err);}
  for(const k in pressed)pressed[k]=false;requestAnimationFrame(frame);}
buildTouch();resize();
window.__sakawa={G,P,A,loadRoom,keys,pressed,fireEvent,drawPortrait,hitEnt,get R(){return R;}};
const fontsReady=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('700 20px Cinzel'),document.fonts.load('20px Spectral'),document.fonts.load('italic 20px Spectral')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontsReady.then(()=>{bgCache={};showTitle();});
requestAnimationFrame(frame);
})();
